[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdns-relay"
version = "0.1.0"
description = "Rule-based mDNS relay for Linux with a web interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdns-relay = "mdns_relay.__main__:main"

[tool.setuptools]
packages = ["mdns_relay"]

[tool.setuptools.package-data]
mdns_relay = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
